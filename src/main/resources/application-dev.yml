spring:
  mongodb:
    uri: mongodb://localhost:27017/test
  redis:
    host: 127.0.0.1
    hostName: 127.0.0.1
    port: 6379
    password: 123456
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
